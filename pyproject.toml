[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spongia-disk-tools"
version = "0.1.0"
description = "CLI tools to analyze disk usage and safely remove files"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "spongia" },
]
dependencies = []

[project.optional-dependencies]
trash = ["send2trash>=1.8"]

tests = ["pytest>=8"]

[project.scripts]
spongia = "spongia:main"

[tool.setuptools]
py-modules = ["spongia", "translations"]
